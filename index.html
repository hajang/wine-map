:root{--surface-0:#f6f5f1;--surface-1:#fcfcfb;--surface-2:#fff;--text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#898781;--border:rgba(11,11,11,.10);--border-strong:rgba(11,11,11,.18);--bg-accent:#E6F1FB;--text-accent:#185FA5;--border-accent:#378ADD;--bg-warning:#FAEEDA;--text-warning:#854F0B;--bg-danger:#FCEBEB;--text-danger:#A32D2D;--bg-pro:#EEEDFE;--text-pro:#534AB7;--radius:8px}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
main{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px)}
h1{font-size:20px;font-weight:500;margin:0 0 12px}
button{font:inherit;font-size:14px;color:var(--text-primary);background:transparent;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
button:active{transform:scale(.98)}
select{font:inherit;font-size:16px;height:38px;color:var(--text-primary);background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:0 8px}
.seg{display:flex;border:0.5px solid var(--border-strong);border-radius:var(--radius);overflow:hidden;flex-shrink:0}
.seg button{border:none;border-radius:0;font-size:13px;padding:8px 10px}
.seg button.on{background:var(--bg-accent);color:var(--text-accent)}
.pre{font-size:12px;padding:5px 10px}
.chip{font-size:13px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.sq{width:8px;height:8px;border-radius:2px;display:inline-block}
.lab{font-size:12px;color:var(--text-muted);margin:14px 0 4px}
.txt{font-size:14px;line-height:1.65;margin:0}
.meter{display:flex;gap:3px}
.meter span{flex:1;height:6px;border-radius:2px;background:var(--border)}
.zb{width:38px;height:38px;padding:0;background:var(--surface-2);font-size:20px;line-height:1}
</style>
</head>
<body>
<main>
<h1>WSET Level 2 포도 품종 지도</h1>
<div style="display:flex;gap:8px;align-items:center;margin:0 0 10px">
<div class="seg" id="flt"><button data-f="all" class="on">전체</button><button data-f="w">화이트</button><button data-f="r">레드</button></div>
<select id="sel" style="flex:1;min-width:0"><option value="">품종 선택</option></select>
</div>
<div style="background:var(--surface-1);border:0.5px solid var(--border);border-radius:12px;padding:8px">
<div id="pres" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px"></div>
<div style="position:relative">
<svg id="map" viewBox="0 0 400 260" width="100%" style="display:block;touch-action:none" role="img" aria-label="와인 산지 세계 지도"></svg>
<div style="position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:6px">
<button class="zb" id="zin" aria-label="확대">+</button>
<button class="zb" id="zout" aria-label="축소">−</button>
</div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-secondary);margin-top:6px;padding-left:2px">
<span><span class="sq" style="background:#BA7517"></span> 화이트</span><span><span class="sq" style="background:#E24B4A"></span> 레드</span><span><span class="sq" style="background:#7F77DD"></span> 화이트+레드</span><span><span style="display:inline-block;width:14px;height:2px;background:#378ADD;vertical-align:middle"></span> 강</span>
</div>
<p style="font-size:12px;color:var(--text-muted);margin:4px 0 0 2px">두 손가락으로 확대하고 드래그로 이동해요. 겹친 점을 누르면 그 지역이 확대돼요.</p>
</div>
<div id="reg" style="margin-top:12px;font-size:14px"></div>
<div id="det" style="margin-top:12px"></div>
</main>

const lab=labG.selectAll('text').data(pts).join('text').text(d=>d.lb).attr('dy','0.35em').style('font-size','12px').style('fill','var(--text-secondary)').style('stroke','var(--surface-1)').style('stroke-width','3px').style('stroke-linejoin','round').style('paint-order','stroke').style('display','none');
function landPaths(gr,f){gr.selectAll('path.c').data(f).join('path').attr('class','c').attr('d',path).attr('vector-effect','non-scaling-stroke').style('fill','var(--border-strong)').style('stroke','var(--surface-1)').style('stroke-width',0.6)}
d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(w=>landPaths(g110,topojson.feature(w,w.objects.countries).features)).catch(()=>{});
let hi=0,riv=null;
function loadHi(){if(hi)return;hi=1;d3.json('https://cdn.jsdelivr.net/npm/sane-topojson@4.0.0/dist/world_50m.json').then(w=>{const o=w.objects;landPaths(g50,topojson.feature(w,o.countries).features);if(o.lakes)g50.append('path').datum(topojson.feature(w,o.lakes)).attr('d',path).style('fill','var(--surface-1)').style('stroke','none');if(o.rivers)riv=g50.append('path').datum(topojson.feature(w,o.rivers)).attr('d',path).attr('vector-effect','non-scaling-stroke').style('fill','none').style('stroke','#378ADD').style('stroke-width',1.2).style('stroke-linecap','round').style('stroke-linejoin','round');hi=2;update()}).catch(()=>{hi=3})}
let raf=0;
function update(){rg.attr('transform',d=>`translate(${T.applyX(d.p[0])},${T.applyY(d.p[1])})`);const on=hi===2&&T.k>=2.5;g110.style('display',on?'none':null);g50.style('display',on?null:'none');if(riv)riv.style('opacity',Math.max(0,Math.min(0.9,(T.k-2.5)/3)));if(T.k>=1.8&&!hi)loadHi();if(!raf)raf=requestAnimationFrame(()=>{raf=0;placeLabels()})}
function placeLabels(){lab.style('display','none');if(T.k<2.5)return;const pri=d=>d.id===sr?3:(sg&&RG[d.id].includes(sg)?2:1);const boxes=[[W-46,0,W,90]],sp=new Map();pts.forEach(d=>{if(!vis(d))return;const x=T.applyX(d.p[0]),y=T.applyY(d.p[1]);sp.set(d.id,[x,y]);boxes.push([x-5,y-5,x+5,y+5])});
pts.filter(d=>sp.has(d.id)).sort((a,b)=>pri(b)-pri(a)).forEach(d=>{if(sg&&pri(d)===1&&T.k<8)return;const[x,y]=sp.get(d.id);if(x<0||x>W||y<0||y>H)return;for(const s of[1,-1]){const x0=s>0?x+8:x-8-d.lw,b=[x0,y-8,x0+d.lw,y+8];if(b[0]<1||b[2]>W-1||b[1]<1||b[3]>H-1)continue;if(boxes.some(o=>b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]))continue;boxes.push(b);lab.filter(o=>o===d).style('display',null).attr('x',s>0?x+8:x-8).attr('y',y).attr('text-anchor',s>0?'start':'end');break}})}
const zoom=d3.zoom().scaleExtent([1,250]).extent([[0,0],[W,H]]).translateExtent([[0,0],[W,H]]).on('zoom',e=>{T=e.transform;zG.attr('transform',T);update()});
svg.call(zoom).on('dblclick.zoom',null);
function render(){rg.each(function(d){const ids=RG[d.id].filter(i=>ok(GM[i]));const h=sg?RG[d.id].includes(sg):ids.length>0;let c;if(sg)c=COL[GM[sg].t];else{const w=ids.some(i=>GM[i].t==='w'),r=ids.some(i=>GM[i].t==='r');c=w&&r?COL.m:w?COL.w:COL.r}
const s=d3.select(this).style('pointer-events',ids.length?'auto':'none');s.select('circle.d').attr('r',h?(d.id===sr?7:5):3.5).style('fill',h?c:'var(--text-muted)').style('opacity',h?1:(ids.length?0.45:0.12)).style('stroke',d.id===sr?'var(--text-primary)':'var(--surface-1)').style('stroke-width',d.id===sr?2:1.2)});
if(sg)rg.filter(d=>RG[d.id].includes(sg)).raise();if(sr)rg.filter(d=>d.id===sr).raise();placeLabels()}
function goTo(cx,cy,k,dur){k=Math.max(1,Math.min(250,k));svg.transition().duration(dur||750).call(zoom.transform,d3.zoomIdentity.translate(W/2-k*cx,H/2-k*cy).scale(k))}
function zoomBounds(x0,y0,x1,y1,mk){const k=Math.min(mk,0.85*Math.min(W/Math.max(x1-x0,.01),H/Math.max(y1-y0,.01)));goTo((x0+x1)/2,(y0+y1)/2,k)}
function zoomLL(b){if(!b)return svg.transition().duration(650).call(zoom.transform,d3.zoomIdentity);const ps=[];for(let i=0;i<=6;i++){const lo=b[0]+(b[2]-b[0])*i/6;ps.push(proj([lo,b[1]]),proj([lo,b[3]]))}const xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]);zoomBounds(Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys),250)}
function zoomGrape(id){const ps=pts.filter(d=>RG[d.id].includes(id)).map(d=>d.p),xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]);zoomBounds(Math.min(...xs)-3,Math.min(...ys)-3,Math.max(...xs)+3,Math.max(...ys)+3,60)}
function zoomRegion(id){const d=pts.find(o=>o.id===id);goTo(d.p[0],d.p[1],Math.max(T.k,Math.min(220,30/d.nn)))}
function tapRegion(d){const x=T.applyX(d.p[0]),y=T.applyY(d.p[1]);const near=pts.some(o=>o!==d&&vis(o)&&Math.hypot(T.applyX(o.p[0])-x,T.applyY(o.p[1])-y)<11);if(near&&T.k<240){svg.transition().duration(500).call(zoom.scaleBy,4,[x,y]);return}pickRegion(d.id)}
const PRE=[['세계',null],['유럽',[-10,36,23,52]],['보르도',[-1.2,44.4,0.2,45.35]],['북미',[-126,34,-117,48]],['남미',[-76,-38,-62,-22]],['호주',[113,-44,154,-30]],['뉴질랜드',[166,-47,179,-38]],['남아공',[17.6,-35,20,-33]]];
const pres=document.getElementById('pres');PRE.forEach(([l,b])=>{const bt=document.createElement('button');bt.className='pre';bt.textContent=l;bt.onclick=()=>zoomLL(b);pres.appendChild(bt)});
document.getElementById('zin').onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,2.5);
document.getElementById('zout').onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,0.4);
function chip(id){const x=GM[id];return`<button class="chip${id===sg?' on':''}" data-g="${id}"><span class="sq" style="background:${COL[x.t]}"></span>${x.k}</button>`}
function showReg(){if(!sr){regEl.innerHTML='';return}const r=R[sr],ids=RG[sr].filter(i=>ok(GM[i]));regEl.innerHTML=`<div style="margin-bottom:8px;font-weight:500">${r[0]} <span style="font-weight:400;color:var(--text-secondary)">· ${r[1]}</span></div><div style="display:flex;flex-wrap:wrap;gap:6px">${ids.map(chip).join('')}</div>`}
function meter(l,v,c){const t=v[0]===v[1]?LV[v[0]-1]:LV[v[0]-1]+' ~ '+LV[v[1]-1];return`<div style="display:grid;grid-template-columns:34px minmax(0,1fr) 108px;align-items:center;gap:10px;margin-top:8px"><span style="font-size:13px;color:var(--text-secondary)">${l}</span><div class="meter">${[1,2,3,4,5].map(i=>`<span${i>=v[0]&&i<=v[1]?` style="background:${c}"`:''}></span>`).join('')}</div><span style="font-size:12px;color:var(--text-secondary);text-align:right">${t}</span></div>`}
function showDet(){if(!sg){detEl.innerHTML='<p style="font-size:14px;color:var(--text-secondary);margin:0">지도의 점을 누르거나 위에서 품종을 고르면 상세 특징이 여기에 나와요.</p>';return}const x=GM[sg],w=x.t==='w',c=COL[x.t],bs='font-size:12px;padding:3px 10px;border-radius:var(--radius);';
detEl.innerHTML=`<div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><p style="font-size:18px;font-weight:500;margin:0">${x.k}</p><p style="font-size:13px;color:var(--text-secondary);margin:2px 0 0">${x.e}</p></div><div style="display:flex;gap:6px;flex-shrink:0">${x.tg?`<span style="${bs}background:var(--bg-pro);color:var(--text-pro)">${x.tg}</span>`:''}<span style="${bs}background:var(--bg-${w?'warning':'danger'});color:var(--text-${w?'warning':'danger'})">${w?'화이트':'레드'}</span></div></div>
<div style="margin-top:6px">${meter('바디',x.b,c)}${meter('산도',x.a,c)}${x.n?meter('탄닌',x.n,c):''}</div>
<p class="lab">아로마</p><p class="txt">${x.ar}</p><p class="lab">양조 포인트</p><p class="txt">${x.mk}</p><p class="lab">대표 스타일</p><p class="txt">${x.st}</p>
<p class="lab">주요 산지 (누르면 지도 이동)</p><div style="display:flex;flex-wrap:wrap;gap:6px">${x.r.split(' ').map(r=>`<button class="chip${r===sr?' on':''}" data-r="${r}">${R[r][0]}</button>`).join('')}</div></div>`}
function pickRegion(id){sr=id;const ids=RG[id].filter(i=>ok(GM[i]));if(!sg||!ids.includes(sg))sg=ids[0]||null;sel.value=sg||'';render();showReg();showDet()}
regEl.addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;sg=b.dataset.g;sel.value=sg;render();showReg();showDet()});
detEl.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;sr=b.dataset.r;render();showReg();showDet();zoomRegion(sr);window.scrollTo({top:0,behavior:'smooth'})});
sel.addEventListener('change',()=>{sg=sel.value||null;if(sr&&(!sg||!RG[sr].includes(sg)))sr=null;render();showReg();showDet();if(sg)zoomGrape(sg);else zoomLL(null)});
document.getElementById('flt').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;filt=b.dataset.f;document.querySelectorAll('#flt button').forEach(x=>x.classList.toggle('on',x===b));if(sg&&!ok(GM[sg]))sg=null;if(sr&&!RG[sr].some(i=>ok(GM[i])))sr=null;fillSel();render();showReg();showDet()});
fillSel();update();render();showDet();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
