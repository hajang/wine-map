:root{--surface-0:#f6f5f1;--surface-1:#fcfcfb;--surface-2:#fff;--text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#898781;--border:rgba(11,11,11,.10);--border-strong:rgba(11,11,11,.18);--bg-accent:#E6F1FB;--text-accent:#185FA5;--border-accent:#378ADD;--bg-warning:#FAEEDA;--text-warning:#854F0B;--bg-danger:#FCEBEB;--text-danger:#A32D2D;--bg-pro:#EEEDFE;--text-pro:#534AB7;--radius:8px}
@media (prefers-color-scheme:dark){:root{--surface-0:#121211;--surface-1:#1a1a19;--surface-2:#242422;--text-primary:#f0efec;--text-secondary:#c3c2b7;--border:rgba(255,255,255,.10);--border-strong:rgba(255,255,255,.18);--bg-accent:#0C447C;--text-accent:#B5D4F4;--bg-warning:#633806;--text-warning:#FAC775;--bg-danger:#791F1F;--text-danger:#F7C1C1;--bg-pro:#3C3489;--text-pro:#CECBF6}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
main{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px)}
h1{font-size:20px;font-weight:500;margin:0 0 12px}
button{font:inherit;font-size:14px;color:var(--text-primary);background:transparent;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
button:active{transform:scale(.98)}
select{font:inherit;font-size:16px;height:38px;color:var(--text-primary);background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:0 8px}
.seg{display:flex;border:0.5px solid var(--border-strong);border-radius:var(--radius);overflow:hidden;flex-shrink:0}
.seg button{border:none;border-radius:0;font-size:13px;padding:8px 10px}
.seg button.on{background:var(--bg-accent);color:var(--text-accent)}
.pre{font-size:12px;padding:5px 10px}
.chip{font-size:13px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.sq{width:8px;height:8px;border-radius:2px;display:inline-block}
.lab{font-size:12px;color:var(--text-muted);margin:14px 0 6px}
.txt{font-size:14px;line-height:1.6;margin:0}
.meter{display:flex;gap:3px}
.meter span{flex:1;height:6px;border-radius:2px;background:var(--border)}
.zb{width:38px;height:38px;padding:0;background:var(--surface-2);font-size:20px;line-height:1}
.row{display:block;width:100%;text-align:left;padding:8px 10px;margin-top:6px}
.row.on{background:var(--bg-accent);border-color:var(--border-accent)}
.row b{font-weight:500;font-size:13px}
.row span{display:block;font-size:13px;color:var(--text-secondary);margin-top:2px}
</style>
</head>
<body>
<main>
<h1>WSET Level 2 포도 품종 지도</h1>
<div style="display:flex;gap:8px;align-items:center;margin:0 0 10px">
<div class="seg" id="flt"><button data-f="all" class="on">전체</button><button data-f="w">화이트</button><button data-f="r">레드</button></div>
<select id="sel" style="flex:1;min-width:0"><option value="">품종 선택</option></select>
</div>
<div id="mapbox" style="background:var(--surface-1);border:0.5px solid var(--border);border-radius:12px;padding:8px;scroll-margin-top:12px">
<div id="pres" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px"></div>
<div style="position:relative">
<svg id="map" viewBox="0 0 400 260" width="100%" style="display:block;touch-action:none" role="img" aria-label="와인 산지 세계 지도"></svg>
<div style="position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:6px">
<button class="zb" id="zin" aria-label="확대">+</button>
<button class="zb" id="zout" aria-label="축소">−</button>
</div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-secondary);margin-top:6px;padding-left:2px">
<span><span class="sq" style="background:#BA7517"></span> 화이트</span><span><span class="sq" style="background:#E24B4A"></span> 레드</span><span><span class="sq" style="background:#7F77DD"></span> 화이트+레드</span><span><span style="display:inline-block;width:14px;height:2px;background:#378ADD;vertical-align:middle"></span> 강</span>
</div>
<p style="font-size:12px;color:var(--text-muted);margin:4px 0 0 2px">점이나 지역 이름을 누르면 선택돼요. 두 손가락으로 확대·이동해요.</p>
</div>
<div id="reg" style="margin-top:12px;font-size:14px"></div>
<div id="det" style="margin-top:12px"></div>
</main>

function showReg(){if(!sr){regEl.innerHTML='';return}const r=R[sr],ids=RG[sr].filter(i=>ok(GM[i]));regEl.innerHTML=`<div style="margin-bottom:8px;font-weight:500">${r[0]} <span style="font-weight:400;color:var(--text-secondary)">· ${r[1]}</span></div><div style="display:flex;flex-wrap:wrap;gap:6px">${ids.map(chip).join('')}</div>`}
function meter(l,v,c){const t=v[0]===v[1]?LV[v[0]-1]:LV[v[0]-1]+' ~ '+LV[v[1]-1];return`<div style="display:grid;grid-template-columns:34px minmax(0,1fr) 108px;align-items:center;gap:10px;margin-top:8px"><span style="font-size:13px;color:var(--text-secondary)">${l}</span><div class="meter">${[1,2,3,4,5].map(i=>`<span${i>=v[0]&&i<=v[1]?` style="background:${c}"`:''}></span>`).join('')}</div><span style="font-size:12px;color:var(--text-secondary);text-align:right">${t}</span></div>`}
function showDet(){if(!sg){detEl.innerHTML='<p style="font-size:14px;color:var(--text-secondary);margin:0">지도의 점이나 이름을 누르거나 위에서 품종을 고르면 요약 카드가 나와요.</p>';return}const x=GM[sg],w=x.t==='w',c=COL[x.t],bs='font-size:12px;padding:3px 10px;border-radius:var(--radius);';
detEl.innerHTML=`<div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><p style="font-size:18px;font-weight:500;margin:0">${x.k}</p><p style="font-size:13px;color:var(--text-secondary);margin:2px 0 0">${x.e} · 교재 ${x.ch}장</p></div><div style="display:flex;gap:6px;flex-shrink:0">${x.p?`<span style="${bs}background:var(--bg-pro);color:var(--text-pro)">주요 품종</span>`:''}<span style="${bs}background:var(--bg-${w?'warning':'danger'});color:var(--text-${w?'warning':'danger'})">${w?'화이트':'레드'}</span></div></div>
<div style="margin-top:6px">${meter('바디',x.b,c)}${meter('산도',x.a,c)}${x.n?meter('탄닌',x.n,c):''}</div>
<p class="lab">핵심 향</p><p class="txt">${x.ar}</p><p class="lab">시험 포인트</p><p class="txt">${x.pt}</p>
<p class="lab">산지별 스타일 (누르면 지도 이동)</p>${x.rs.map(([ids,ti,n])=>{const a=[].concat(ids);return`<button class="row${a.some(isH)?' on':''}" data-r="${a.join(',')}"><b>${ti}</b><span>${n}</span></button>`}).join('')}</div>`}
function pickRegion(id){sr=id;hl=[id];const ids=RG[id].filter(i=>ok(GM[i]));if(!sg||!ids.includes(sg))sg=ids[0]||null;sel.value=sg||'';render();showReg();showDet()}
regEl.addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;sg=b.dataset.g;sel.value=sg;render();showReg();showDet()});
detEl.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;const ids=b.dataset.r.split(',');hl=ids;sr=ids.length===1?ids[0]:null;render();showReg();showDet();zoomIds(ids);document.getElementById('mapbox').scrollIntoView({behavior:'smooth',block:'start'})});
sel.addEventListener('change',()=>{sg=sel.value||null;if(!sg||(sr&&!RG[sr].includes(sg))){sr=null;hl=[]}hl=hl.filter(i=>sg&&RG[i].includes(sg));render();showReg();showDet();if(sg)zoomGrape(sg);else zoomLL(null)});
document.getElementById('flt').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;filt=b.dataset.f;document.querySelectorAll('#flt button').forEach(x=>x.classList.toggle('on',x===b));if(sg&&!ok(GM[sg])){sg=null;hl=[]}if(sr&&!RG[sr].some(i=>ok(GM[i]))){sr=null;hl=[]}fillSel();render();showReg();showDet()});
fillSel();update();render();showDet();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
